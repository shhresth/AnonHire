version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: anonhire-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: anonhire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - anonhire-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anonhire-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/anonhire
    env_file:
      - .env
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - anonhire-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anonhire-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - anonhire-network

volumes:
  postgres_data:

networks:
  anonhire-network:
    driver: bridge

